<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1d3a">
<title>Lauf-Adventskalender</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:linear-gradient(#0b1d3a,#1d4170 55%,#8fb7de);font-family:Georgia,"Times New Roman",serif;overflow:hidden;position:relative;color:#fff;--s:min(calc((100vw - 36px)/5),82px,calc((100vh - 200px)/5.2))}
.c1{--bg:#c4162a;--rb:#ffd24a;--nc:#ffd24a}
.c2{--bg:#1b8a43;--rb:#fff;--nc:#fff}
.c3{--bg:#f0be3c;--rb:#c8102e;--nc:#c8102e}
#snow{position:fixed;inset:0;pointer-events:none;z-index:2}
#snow i{position:absolute;top:-10px;background:#fff;border-radius:50%;opacity:.8;animation:sn linear infinite}
@keyframes sn{to{transform:translate(30px,105vh)}}
.hill{position:fixed;left:0;right:0;bottom:0;height:24vh;z-index:1;background:radial-gradient(ellipse 65% 95% at 25% 100%,#fff 98%,#fff0 100%),radial-gradient(ellipse 60% 80% at 80% 100%,#e6f0fb 98%,#e6f0fb00 100%)}
.front{position:fixed;left:-5%;right:-5%;bottom:0;height:4.5vh;z-index:4;pointer-events:none;background:#fff;border-radius:50% 50% 0 0/100% 100% 0 0}
h1{position:relative;z-index:3;margin:16px 0 0;text-align:center;font-weight:700;line-height:1.15;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.b{display:inline-block;position:relative;margin:0 1px;font-size:min(8.6vw,38px);color:var(--c);text-shadow:0 0 6px var(--c),0 0 16px var(--c);animation:tw 1.6s ease-in-out infinite alternate;animation-delay:calc(var(--i)*.13s)}
.b::before{content:"";position:absolute;top:-3px;left:50%;width:5px;height:6px;margin-left:-2px;background:#27323f;border-radius:1px}
@keyframes tw{from{opacity:.5}to{opacity:1}}
#load{position:absolute;z-index:5;top:50%;left:50%;width:min(82vw,420px);transform:translate(-50%,-50%);text-align:center;transition:opacity .5s}
#load p{margin:18px 0 0;font-style:italic}
.trk{position:relative;height:16px;margin-top:50px;border-radius:9px;background:rgba(255,255,255,.22)}
#fill{height:100%;width:0;border-radius:9px;background:repeating-linear-gradient(45deg,#d4202e 0 10px,#fff 10px 20px)}
#elf{position:absolute;bottom:100%;left:0;width:40px;height:52px;margin-bottom:-2px;animation:bob .3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.lg{transform-box:fill-box;transform-origin:50% 0;animation:run .3s ease-in-out infinite alternate}
.lg2{animation-direction:alternate-reverse}
@keyframes run{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
#cal{position:absolute;left:0;right:0;bottom:3.5vh;z-index:3;display:flex;flex-direction:column-reverse;align-items:center}
.row{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin-top:4px}
.pk{position:relative;width:var(--s);height:var(--s);border-radius:6px;cursor:pointer;background:var(--bg);box-shadow:inset -5px -5px 0 rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.3);animation:fall .8s cubic-bezier(.3,1.4,.5,1) backwards;animation-delay:var(--d)}
.pk.w{width:calc(var(--s)*2 + 4px);height:calc(var(--s)*.78)}
@keyframes fall{from{transform:translateY(110vh) rotate(8deg);opacity:0}}
.pk .r,.pk .h{position:absolute;background:var(--rb)}
.pk .r{left:43%;width:14%;top:0;bottom:0}
.pk .h{top:43%;height:14%;left:0;right:0}
.pk .n{position:absolute;inset:0;margin:auto;width:58%;aspect-ratio:1;max-height:92%;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);border:2px solid var(--rb);color:var(--nc);font-weight:700;font-size:calc(var(--s)*.34);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pk b{display:none;position:absolute;top:-16%;width:50%;height:16%;background:var(--bg)}
.pk .fl{left:0;transform-origin:0 100%;transform:rotate(-30deg)}
.pk .fr{right:0;transform-origin:100% 100%;transform:rotate(30deg)}
.past{background:#0f1a2b;box-shadow:inset 0 0 0 3px var(--bg)}
.past b{display:block}
.past .r,.past .h{display:none}
.past .n{background:none;border-color:transparent;opacity:.5}
.today::after{content:"";position:absolute;inset:-3px;border-radius:9px;box-shadow:0 0 16px 5px #fff;animation:gl 1.4s ease-in-out infinite alternate;pointer-events:none}
@keyframes gl{from{opacity:.3}}
.wob{animation:wob .45s}
@keyframes wob{20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
#ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(4,12,32,.72)}
#ov.on{display:flex}
.stage{position:relative;width:min(84vw,380px);height:min(64vh,440px);perspective:1100px;animation:pop .5s cubic-bezier(.3,1.3,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.card{position:absolute;inset:0;border-radius:10px;background:linear-gradient(#fbfdff,#d6e8f7);color:#25354a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:12px}
.card h2{margin:0;color:#c8102e;font-size:1.6rem;line-height:1.15}
#cx{font-size:1.1rem;line-height:1.45;width:100%}
.card button{margin-top:8px;padding:10px 20px;border:0;border-radius:20px;background:#c8102e;color:#fff;font:inherit;cursor:pointer}
.flap{position:absolute;top:0;width:50%;height:100%;background:var(--bg);transition:transform 1.1s cubic-bezier(.5,0,.2,1)}
.flap.fl{left:0;transform-origin:left center;border-radius:10px 0 0 10px}
.flap.fr{right:0;transform-origin:right center;border-radius:0 10px 10px 0}
.flap i{position:absolute;top:0;bottom:0;width:7%;background:var(--rb)}
.flap.fl i{right:0}.flap.fr i{left:0}
.open .flap.fl{transform:rotateY(-118deg)}
.open .flap.fr{transform:rotateY(118deg)}
.bn{position:absolute;z-index:2;left:50%;top:50%;width:96px;height:96px;margin:-48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);border:4px solid var(--rb);color:var(--nc);font-size:46px;font-weight:700;transition:opacity .4s}
.open .bn{opacity:0}
.cane{display:flex;height:46px;margin:12px 0 6px;border-radius:23px;overflow:hidden;box-shadow:0 0 0 3px #fff,0 0 0 4px #c9d6e2}
.cane span{display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;line-height:1.1;padding:0 4px}
.cane .rd{color:#fff;background:repeating-linear-gradient(45deg,#d4202e 0 9px,#e9505c 9px 18px)}
.cane .wh{color:#a8101f;background:repeating-linear-gradient(45deg,#fff 0 9px,#e4ebf2 9px 18px)}
.small{font-size:.85rem;opacity:.75}
#tp{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(0,0,0,.85);padding:10px 14px;border-radius:12px;display:flex;gap:8px;align-items:center;font:14px system-ui,sans-serif}
#tp[hidden]{display:none}
#tp select,#tp button{font:inherit;padding:4px 6px}
@media (prefers-reduced-motion:reduce){#snow i{animation:none}}
</style></head><body>
<div id="snow"></div><div class="hill"></div><h1 id="ttl"></h1>
<div id="load"><div class="trk"><div id="fill"></div>
<svg id="elf" viewBox="0 0 40 52"><rect class="lg" x="13" y="42" width="5" height="9" rx="2" fill="#7a3b1e"/><rect class="lg lg2" x="22" y="42" width="5" height="9" rx="2" fill="#7a3b1e"/><rect x="11" y="28" width="18" height="16" rx="4" fill="#1b8a43"/><rect x="11" y="35" width="18" height="3" fill="#ffd24a"/><circle cx="20" cy="20" r="9" fill="#f6d0b0"/><polygon points="6,19 20,18 12,22" fill="#f6d0b0"/><polygon points="34,19 20,18 28,22" fill="#f6d0b0"/><circle cx="17" cy="20" r="1.3" fill="#222"/><circle cx="23" cy="20" r="1.3" fill="#222"/><path d="M17 24q3 2 6 0" stroke="#a33" fill="none" stroke-width="1.2"/><polygon points="9,15 20,0 31,15" fill="#c8102e"/><circle cx="20" cy="2" r="3.2" fill="#fff"/><rect x="9" y="13" width="22" height="4" rx="2" fill="#fff"/></svg></div>
<p>Das Weihnachtsdorf macht sich bereit …</p></div>
<div id="cal"></div><div class="front"></div>
<div id="ov"><div class="stage" id="st"><div class="card"><h2 id="ct"></h2><div id="cx"></div><button id="cl">Zurück zum Kalender</button></div><div class="flap fl"><i></i></div><div class="flap fr"><i></i></div><div class="bn" id="bn"></div></div></div>
<div id="tp" hidden><span>Testdatum:</span><select id="sel"></select><button id="tx">OK</button></div>
<script>
const $=id=>document.getElementById(id);
const D=[,
["Rentier-Aufwärmrunde","1 Kilometer laufen"],
["Tannenbaum-Suche","25 Minuten laufen, so schnell man will"],
["Elfenmarathon","3 Kilometer laufen"],
["Rentier-Intervalle","5 Minuten warm laufen, dann 3 Minuten zügig laufen und 1 Minute Pause (gehen). 4 Runden"],
["Nikolaus-Probelauf","2 Kilometer laufen"],
["Nikolaus-Tour","4 Kilometer laufen"],
["Einpack-Express","15 Minuten laufen, so schnell man will"],
["Schlitten-Achterbahn","8 Minuten laufen, 2 Minuten langsam laufen, 8 Minuten laufen"],
["Rentier-Anlauf","2 Kilometer laufen: den ersten langsamer, den zweiten mindestens 30 Sekunden pro Kilometer schneller"],
["Elfen-Schichtwechsel","10 Minuten laufen, 3 Minuten gehen, 10 Minuten laufen"],
["Elfen-Sprints","5 Minuten warm laufen, dann 200 Meter zügig laufen und 200 Meter gehen. 5 Runden"],
["Engelchen-Probe","1,2 Kilometer laufen"],
["3. Kerzlein-Lauf","13 Minuten laufen, so schnell man will"],
["Weihnachtsmarkt-Runde","5 Kilometer laufen"],
["Weihnachtsbäckerei-Doppelschicht","15 Minuten laufen, 3 Minuten gehen, 15 Minuten laufen"],
["Zuckerstangen-Lauf",'<div>Erst 5 Minuten warm laufen, dann:</div><div class="cane"><span class="rd" style="flex:3">3 Min zügig</span><span class="wh" style="flex:3">3 Min langsamer</span><span class="rd" style="flex:3">3 Min zügig</span></div><div class="small">Langsamer heißt: mindestens 1 Minute pro Kilometer langsamer als zügig</div>'],
["Geschenke-Lieferung","3 Kilometer laufen"],
["Wichtel-Intervalle","5 Minuten warm laufen, dann 300 Meter zügig und 200 Meter locker laufen. 4 Runden"],
["Lebkuchenhaus-Bauzeit","20 Minuten laufen, so schnell man will"],
["Letztes-Kerzlein-Lauf","2 Kilometer laufen"],
["Schlitten-Belade-Intervalle","5 Minuten warm laufen, dann 400 Meter zügig und 400 Meter locker laufen. 4 Runden"],
["Weihnachtsdorf-Runde","22 Minuten laufen, so schnell man will"],
["Große Bescherungsrunde","5 Kilometer laufen"]];
const M={14:1,3:2,21:3,9:1,17:2,22:2,6:3,11:1,1:3,8:3,19:1,4:2,23:1,12:3,16:2,2:3,20:1,13:2,7:1,18:3,10:2,5:1,15:3};
const L=[[14,3,21,9,17],[22,6,11,1],[8,19,4,23,12],[16,2,20,13,7],[18,10,5,15]];
let test=null,ac;
const day=()=>{if(test!==null)return test;const d=new Date();return d.getMonth()===11?d.getDate():0};
// Schnee
for(let i=0;i<40;i++){const f=document.createElement('i'),s=2+Math.random()*4;f.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${6+Math.random()*8}s;animation-delay:-${Math.random()*10}s`;$('snow').append(f)}
// Lichterkette im Titel
const K=['#ff4d4d','#ffd23f','#5ee06b','#4db8ff','#ff7ad9'];
['Lauf-','Adventskalender'].forEach((t,k)=>{const l=document.createElement('div');[...t].forEach((c,j)=>{const s=document.createElement('span');s.className='b';s.textContent=c;s.style.setProperty('--c',K[(j+k*2)%5]);s.style.setProperty('--i',j+k*3);l.append(s)});$('ttl').append(l)});
// Ladebalken mit Elfe
const t0=performance.now(),DUR=3200,trk=document.querySelector('.trk');
function step(now){const p=Math.min((now-t0)/DUR,1),w=trk.clientWidth,x=p*(w-40);$('elf').style.left=x+'px';$('fill').style.width=(p<1?x+24:w)+'px';if(p<1)requestAnimationFrame(step);else{$('load').style.opacity=0;setTimeout(()=>{$('load').style.display='none';build()},500)}}
requestAnimationFrame(step);
// Pakete
function build(){const cal=$('cal');L.forEach((r,ri)=>{const row=document.createElement('div');row.className='row';r.forEach((n,i)=>{const p=document.createElement('div');p.className='pk c'+M[n]+(n===6?' w':'');p.dataset.n=n;p.setAttribute('aria-label','Türchen '+n);p.style.setProperty('--d',(.1+(ri*5+i)*.07)+'s');p.innerHTML='<i class="r"></i><i class="h"></i><b class="fl"></b><b class="fr"></b><span class="n">'+n+'</span>';row.append(p)});cal.append(row)});apply()}
function apply(){const d=day();document.querySelectorAll('.pk').forEach(p=>{const n=+p.dataset.n;p.classList.toggle('past',n<d);p.classList.toggle('today',n===d)})}
$('cal').onclick=e=>{const p=e.target.closest('.pk');if(!p)return;const n=+p.dataset.n,d=day();
 if(n===d){ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();openDoor(n,p)}
 else if(n>d){p.classList.remove('wob');void p.offsetWidth;p.classList.add('wob')}};
// Tür öffnen
function openDoor(n,p){const st=$('st');st.className='stage c'+M[n];$('ct').textContent=D[n][0];$('cx').innerHTML=D[n][1];$('bn').textContent=n;$('ov').classList.add('on');
 setTimeout(()=>{st.classList.add('open');bells()},650)}
$('cl').onclick=()=>$('ov').classList.remove('on');
// Glöckchen (selbst erzeugt, keine Datei nötig)
function bells(){if(!ac)return;[1319,1568,1760,2093,1760,2349,2093,2637].forEach((f,i)=>{const t=ac.currentTime+i*.12;[[f,.2],[f*2.76,.06]].forEach(([fr,g])=>{const o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.value=fr;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+1.4);o.connect(v);v.connect(ac.destination);o.start(t);o.stop(t+1.5)})})}
// Versteckter Testmodus: Titel lange gedrückt halten
const sel=$('sel');sel.innerHTML='<option value="">Echtes Datum</option><option value="0">Vor dem 1. Dezember</option>'+Array.from({length:24},(_,i)=>`<option value="${i+1}">${i+1}. Dezember${i===23?' (alles leer)':''}</option>`).join('');
sel.onchange=()=>{test=sel.value===''?null:+sel.value;apply()};
$('tx').onclick=()=>$('tp').hidden=true;
let lp;const ttl=$('ttl');
ttl.addEventListener('pointerdown',()=>{lp=setTimeout(()=>$('tp').hidden=false,800)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>ttl.addEventListener(ev,()=>clearTimeout(lp)));
ttl.addEventListener('contextmenu',e=>e.preventDefault());
</script></body></html>
