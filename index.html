<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf2fa">
<title>Lauf-Adventskalender</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:linear-gradient(#e6f0f9,#f6faff 55%,#fff);font-family:Georgia,"Times New Roman",serif;overflow:hidden;position:relative;color:#25354a;--s:min(calc((100vw - 24px)/5.4),82px,calc((100vh - 370px)/6.3))}
.c1{--bg:#c4162a;--bg2:#8e0e1c;--rb:#e8b830;--nc:#ffd24a}
.c2{--bg:#1b8a43;--bg2:#0f5a29;--rb:#f4f4f0;--nc:#fff}
.c3{--bg:#e9b52f;--bg2:#a8761a;--rb:#c8102e;--nc:#c8102e}
#snow{position:fixed;inset:0;pointer-events:none;z-index:2}
#snow i{position:absolute;top:-10px;background:#b9d0e8;border-radius:50%;opacity:.9;animation:sn linear infinite}
@keyframes sn{to{transform:translate(30px,105vh)}}
.bgs{position:fixed;left:0;bottom:0;width:100%;height:36vh;z-index:1}
#ttl{position:relative;z-index:3;width:min(88vw,400px);margin:5vh auto 0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#ttl svg{display:block;width:100%;overflow:visible}
#ttl use{stroke-linecap:round;stroke-dasharray:.01 64;fill:none}#ttl use.bs{fill:#14110f;stroke:#14110f;stroke-width:3;stroke-dasharray:none;stroke-linejoin:round}
.L{animation:bl 1.4s ease-in-out infinite}
@keyframes bl{50%{opacity:.2}}
#load{position:absolute;z-index:5;top:55%;left:50%;width:min(82vw,420px);transform:translate(-50%,-50%);text-align:center;transition:opacity .5s}
#load p{margin:18px 0 0;font-style:italic;color:#46617c}
.trk{position:relative;height:16px;margin-top:50px;border-radius:9px;background:rgba(70,100,140,.18)}
#fill{height:100%;width:0;border-radius:9px;background:repeating-linear-gradient(45deg,#d4202e 0 10px,#fff 10px 20px);box-shadow:0 0 0 1px #d4202e inset}
#elf{position:absolute;bottom:100%;left:0;width:40px;height:52px;margin-bottom:-2px;animation:bob .3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.lg{transform-box:fill-box;transform-origin:50% 0;animation:run .3s ease-in-out infinite alternate}
.lg2{animation-direction:alternate-reverse}
@keyframes run{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
#cal{position:absolute;left:50%;bottom:calc(6.5vh + 40px);z-index:3;width:calc(var(--s)*5.4);height:calc(var(--s)*6.2);transform:translateX(-50%)}
.pk{position:absolute;width:var(--s);height:var(--s);cursor:pointer;animation:fall .8s cubic-bezier(.3,1.4,.5,1) backwards;animation-delay:var(--d)}
.pk.t{width:calc(var(--s)*.95);height:calc(var(--s)*2.05)}
@keyframes fall{from{transform:translateY(110vh) rotate(8deg);opacity:0}}
.in{position:absolute;inset:0;transform-origin:50% 100%;transform:rotate(var(--rt)) scale(var(--sc))}
.bx{position:absolute;left:4%;right:4%;top:calc(var(--s)*.24);bottom:0;border-radius:2px 2px 7px 7px;background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(255,255,255,.14) 20%,rgba(255,255,255,0) 45%,rgba(0,0,0,.14)),var(--bg);box-shadow:inset 2px 0 0 rgba(255,255,255,.22),0 3px 6px rgba(40,60,90,.4)}
.ld{position:absolute;left:0;right:0;top:calc(var(--s)*.06);height:calc(var(--s)*.26);border-radius:4px;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0) 50%,rgba(0,0,0,.16)),var(--bg);box-shadow:0 4px 5px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35)}
.r{position:absolute;left:40%;width:20%;top:calc(var(--s)*.06);bottom:0;background:linear-gradient(90deg,rgba(0,0,0,.26),rgba(255,255,255,.4) 30%,rgba(255,255,255,.04) 58%,rgba(0,0,0,.28)),var(--rb)}
.bow{position:absolute;left:50%;transform:translateX(-50%);width:calc(var(--s)*.9);top:calc(var(--s)*-.2);overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.nb .bow{width:calc(var(--s)*.5);top:calc(var(--s)*-.01)}
.n{position:absolute;left:50%;top:calc(var(--s)*.62);transform:translate(-50%,-50%);width:50%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),var(--bg);border:2px solid var(--rb);box-shadow:0 1px 3px rgba(0,0,0,.45);color:var(--nc);font-weight:700;font-size:calc(var(--s)*.3);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pk b{display:none;position:absolute;top:calc(var(--s)*.04);height:calc(var(--s)*.2);width:46%;background:var(--bg2)}
.pk .fl{left:4%;transform-origin:0 100%;transform:rotate(-28deg)}
.pk .fr{right:4%;transform-origin:100% 100%;transform:rotate(28deg)}
.past b{display:block}
.past .ld,.past .r,.past .bow{display:none}
.past .bx{box-shadow:inset 0 calc(var(--s)*.22) 0 #0f1a2b,0 3px 6px rgba(40,60,90,.4)}
.past .n{background:none;border-color:transparent;box-shadow:none;opacity:.5}
.done{filter:grayscale(.85);opacity:.88}
.today::after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:0 0 18px 6px #ffe27a;animation:gl 1.4s ease-in-out infinite alternate;pointer-events:none}
@keyframes gl{from{opacity:.25}}
.wob{animation:wob .45s}
@keyframes wob{20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
#ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(30,50,80,.5)}
#ov.on{display:flex}
.stage{position:relative;width:min(84vw,380px);height:min(64vh,440px);perspective:1100px;border-radius:10px;background:radial-gradient(ellipse at 50% 40%,var(--bg),var(--bg2));box-shadow:0 10px 30px rgba(0,0,0,.45)}
.card{position:absolute;inset:6%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 18px;gap:10px;color:#3a2f26;background:repeating-linear-gradient(0deg,rgba(120,100,70,.035) 0 2px,transparent 2px 4px),linear-gradient(#fffdf7,#f6f0e2);transform:rotate(-1.2deg);box-shadow:0 2px 8px rgba(0,0,0,.45);overflow:hidden}
.card::before{content:"";position:absolute;right:0;bottom:0;width:30px;height:30px;background:linear-gradient(135deg,#0000 50%,#d9cfb8 50%,#f3ecdb);box-shadow:-2px -2px 4px rgba(0,0,0,.18)}
.card::after{content:"";position:absolute;left:0;right:0;top:52%;height:1px;background:rgba(90,70,40,.1);box-shadow:0 1px 0 rgba(255,255,255,.6)}
.card h2{margin:0;color:#c8102e;font:400 clamp(2.1rem,10vw,2.8rem)/1.05 'Great Vibes',cursive}
#cx{font-size:1.1rem;line-height:1.45;width:100%}
.card button{position:relative;z-index:1;margin-top:8px;padding:11px 26px;border:0;border-radius:22px;background:#c8102e;color:#fff;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.flap{position:absolute;z-index:2;top:0;width:50%;height:100%;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%,rgba(0,0,0,.14)),var(--bg);transition:transform 1.1s cubic-bezier(.5,0,.2,1)}
.flap.fl{left:0;transform-origin:left center;border-radius:10px 0 0 10px}
.flap.fr{right:0;transform-origin:right center;border-radius:0 10px 10px 0}
.flap i{position:absolute;top:0;bottom:0;width:9%;background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,255,255,.4) 40%,rgba(0,0,0,.2)),var(--rb)}
.flap.fl i{right:0}.flap.fr i{left:0}
.open .flap.fl{transform:rotateY(-118deg)}
.open .flap.fr{transform:rotateY(118deg)}
.bn{position:absolute;z-index:3;left:50%;top:56%;width:84px;height:84px;margin:-42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),var(--bg);border:4px solid var(--rb);color:var(--nc);font-size:40px;font-weight:700;transition:opacity .4s}
.ob{position:absolute;z-index:3;left:50%;top:-6%;width:70%;transform:translateX(-50%);overflow:visible;transition:opacity .4s;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.open .bn,.open .ob{opacity:0}
.cane{display:flex;height:46px;margin:12px 0 6px;border-radius:23px;overflow:hidden;box-shadow:0 0 0 3px #fff,0 0 0 4px #c9d6e2}
.cane span{display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;line-height:1.1;padding:0 4px}
.cane .rd{color:#fff;background:repeating-linear-gradient(45deg,#d4202e 0 9px,#e9505c 9px 18px)}
.cane .wh{color:#a8101f;background:repeating-linear-gradient(45deg,#fff 0 9px,#e4ebf2 9px 18px)}
.small{font-size:.85rem;opacity:.75}
#tp{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(0,0,0,.85);color:#fff;padding:10px 14px;border-radius:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:14px system-ui,sans-serif}
#tp[hidden]{display:none}
#tp select,#tp button{font:inherit;padding:4px 6px}
@media (prefers-reduced-motion:reduce){#snow i{animation:none}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><g id="bw">
<path d="M50 38C40 18 18 2 6 10C-2 17 8 36 30 42C40 44 46 42 50 38Z" style="fill:var(--rb)" stroke="rgba(0,0,0,.25)" stroke-width="1"/>
<path d="M50 38C60 18 82 2 94 10C102 17 92 36 70 42C60 44 54 42 50 38Z" style="fill:var(--rb)" stroke="rgba(0,0,0,.25)" stroke-width="1"/>
<path d="M48 36C40 22 24 10 12 12C22 14 36 26 48 36Z" fill="#fff" opacity=".4"/>
<path d="M52 36C60 22 76 10 88 12C78 14 64 26 52 36Z" fill="#fff" opacity=".4"/>
<path d="M50 40C40 43 30 41 22 37C34 41 44 41 50 38Z" fill="#000" opacity=".3"/>
<path d="M50 40C60 43 70 41 78 37C66 41 56 41 50 38Z" fill="#000" opacity=".3"/>
<path d="M46 40C38 46 26 54 14 58L26 60C36 56 46 50 52 42Z" style="fill:var(--rb)" stroke="rgba(0,0,0,.25)" stroke-width="1"/>
<path d="M54 40C62 46 74 54 86 58L74 60C64 56 54 50 48 42Z" style="fill:var(--rb)" stroke="rgba(0,0,0,.25)" stroke-width="1"/>
<rect x="43" y="30" width="14" height="14" rx="3" style="fill:var(--rb)" stroke="rgba(0,0,0,.3)" stroke-width="1"/>
<rect x="45" y="32" width="5" height="9" rx="2" fill="#fff" opacity=".4"/></g></defs></svg>
<div id="snow"></div>
<svg class="bgs" viewBox="0 0 400 260" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><path d="M0 150Q80 105 165 138T320 118T400 140V260H0Z" fill="#e6eff9"/><path d="M0 188Q100 150 200 180T400 165V260H0Z" fill="#f2f7fc"/><path d="M0 218Q120 192 230 212T400 202V260H0Z" fill="#fff"/><g fill="#7ba58f"><polygon points="22,176 36,140 50,176"/><polygon points="28,160 36,128 44,160"/><polygon points="360,160 374,122 388,160"/><polygon points="366,142 374,112 382,142"/><polygon points="62,190 71,166 80,190"/><polygon points="332,182 341,158 350,182"/></g><g fill="#fff"><polygon points="36,128 32,138 40,138"/><polygon points="374,112 370,122 378,122"/></g></svg>
<h1 id="ttl" style="margin-bottom:0" aria-label="Lauf-Adventskalender"></h1>
<div id="load"><div class="trk"><div id="fill"></div>
<svg id="elf" viewBox="0 0 40 52"><rect class="lg" x="13" y="42" width="5" height="9" rx="2" fill="#7a3b1e"/><rect class="lg lg2" x="22" y="42" width="5" height="9" rx="2" fill="#7a3b1e"/><rect x="11" y="28" width="18" height="16" rx="4" fill="#1b8a43"/><rect x="11" y="35" width="18" height="3" fill="#ffd24a"/><circle cx="20" cy="20" r="9" fill="#f6d0b0"/><polygon points="6,19 20,18 12,22" fill="#f6d0b0"/><polygon points="34,19 20,18 28,22" fill="#f6d0b0"/><circle cx="17" cy="20" r="1.3" fill="#222"/><circle cx="23" cy="20" r="1.3" fill="#222"/><path d="M17 24q3 2 6 0" stroke="#a33" fill="none" stroke-width="1.2"/><polygon points="9,15 20,0 31,15" fill="#c8102e"/><circle cx="20" cy="2" r="3.2" fill="#fff"/><rect x="9" y="13" width="22" height="4" rx="2" fill="#fff"/></svg></div>
<p>Das Weihnachtsdorf macht sich bereit …</p></div>
<div id="cal"></div>
<div id="ov"><div class="stage" id="st"><div class="card"><h2 id="ct"></h2><div id="cx"></div><button id="cl">Los geht’s!</button></div><div class="flap fl"><i></i></div><div class="flap fr"><i></i></div><svg class="ob" viewBox="0 0 100 60"><use href="#bw"/></svg><div class="bn" id="bn"></div></div></div>
<div id="tp" hidden><span>Testdatum:</span><select id="sel"></select><span>Ton:</span><select id="snd"></select><button id="pl">▶ Anhören</button><button id="rs">Erledigt zurücksetzen</button><button id="tx">OK</button></div>
<script>
const $=id=>document.getElementById(id);
const D=[,
["Rentier-Aufwärmrunde","1 Kilometer laufen"],
["Tannenbaum-Suche","25 Minuten laufen, so schnell man will"],
["Elfenmarathon","3 Kilometer laufen"],
["Rentier-Intervalle","5 Minuten warm laufen, dann 3 Minuten zügig laufen und 1 Minute Pause (gehen). 4 Runden"],
["Nikolaus-Probelauf","2 Kilometer laufen"],
["Nikolaus-Tour","4 Kilometer laufen"],
["Einpack-Express","15 Minuten laufen, so schnell man will"],
["Schlitten-Achterbahn","8 Minuten laufen, 2 Minuten langsam laufen, 8 Minuten laufen"],
["Rentier-Anlauf","2 Kilometer laufen: den ersten langsamer, den zweiten mindestens 30 Sekunden pro Kilometer schneller"],
["Elfen-Schichtwechsel","10 Minuten laufen, 3 Minuten gehen, 10 Minuten laufen"],
["Elfen-Sprints","5 Minuten warm laufen, dann 200 Meter zügig laufen und 200 Meter gehen. 5 Runden"],
["Engelchen-Probe","1,2 Kilometer laufen"],
["3. Kerzlein-Lauf","13 Minuten laufen, so schnell man will"],
["Weihnachtsmarkt-Runde","5 Kilometer laufen"],
["Weihnachtsbäckerei-Doppelschicht","15 Minuten laufen, 3 Minuten gehen, 15 Minuten laufen"],
["Zuckerstangen-Lauf",'<div>Erst 5 Minuten warm laufen, dann:</div><div class="cane"><span class="rd" style="flex:3">3 Min zügig</span><span class="wh" style="flex:3">3 Min langsamer</span><span class="rd" style="flex:3">3 Min zügig</span></div><div class="small">Langsamer heißt: mindestens 1 Minute pro Kilometer langsamer als zügig</div>'],
["Geschenke-Lieferung","3 Kilometer laufen"],
["Wichtel-Intervalle","5 Minuten warm laufen, dann 300 Meter zügig und 200 Meter locker laufen. 4 Runden"],
["Lebkuchenhaus-Bauzeit","20 Minuten laufen, so schnell man will"],
["Letztes-Kerzlein-Lauf","2 Kilometer laufen"],
["Schlitten-Belade-Intervalle","5 Minuten warm laufen, dann 400 Meter zügig und 400 Meter locker laufen. 4 Runden"],
["Weihnachtsdorf-Runde","22 Minuten laufen, so schnell man will"],
["Große Bescherungsrunde","5 Kilometer laufen"]];
// Paket-Positionen von unten nach oben: [Nummer, x, Reihe, hochstehend]
const S=[[14,0,0],[3,1.1,0],[21,2.2,0],[9,3.3,0],[17,4.4,0],
[22,.55,1],[11,1.65,1],[1,2.75,1],[6,4.4,1,1],
[8,0,2],[19,1.1,2],[4,2.2,2],[23,3.3,2],
[16,0,3],[2,1.1,3],[20,2.2,3],[13,3.3,3],[7,4.4,3],
[18,.55,4],[10,1.65,4],[5,2.75,4],[15,3.85,4],
[12,2.2,5]];
const BIG=[12,18,10,5,15,7];
let test=null,ac,cur=0,ton=0;try{ton=+localStorage.getItem('lauf-ton')||0}catch(e){}
// Erledigt-Markierung: wird nur auf diesem Gerät im Browser gespeichert (kein Login nötig)
const KEY='lauf-adventskalender-erledigt';let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch(e){}};
const day=()=>{if(test!==null)return test;const d=new Date();return d.getMonth()===11?d.getDate():0};
// Schnee
for(let i=0;i<40;i++){const f=document.createElement('i'),s=2+Math.random()*4;f.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${6+Math.random()*8}s;animation-delay:-${Math.random()*10}s`;$('snow').append(f)}
// Lichterkette in Schreibschrift
(function(){let h='<svg viewBox="0 0 400 190"><defs><g id="tx" font-family="\'Great Vibes\',cursive" text-anchor="middle"><text x="200" y="80" font-size="88">Lauf-</text><text x="200" y="168" font-size="72">Adventskalender</text></g></defs><use class="bs" href="#tx"/>';
['#ff3b3b','#ffc928','#33c957','#2f9bff'].forEach((c,i)=>{h+=`<g class="L" style="animation-delay:-${i*.45}s;animation-duration:${1.1+i*.35}s" stroke="${c}" stroke-dashoffset="${-16*i}"><use href="#tx" stroke-width="13" opacity=".22"/><use href="#tx" stroke-width="6.5"/></g>`});
$('ttl').innerHTML=h+'</svg>'})();
// Ladebalken mit Elfe
const t0=performance.now(),DUR=3200,trk=document.querySelector('.trk');
function step(now){const p=Math.min((now-t0)/DUR,1),w=trk.clientWidth,x=p*(w-40);$('elf').style.left=x+'px';$('fill').style.width=(p<1?x+24:w)+'px';if(p<1)requestAnimationFrame(step);else{$('load').style.opacity=0;setTimeout(()=>{$('load').style.display='none';build()},500)}}
requestAnimationFrame(step);
// Pakete
function build(){const cal=$('cal');let last=-1,ci=0;
 S.forEach(([n,x,y,t],i)=>{ci=y===last?ci+1:0;last=y;
  const h=Math.abs(Math.sin(n*12.9898)*43758.5453)%1,g=Math.abs(Math.sin(n*78.233)*12345.6)%1;
  const p=document.createElement('div');p.className='pk c'+(((y*2+ci)%3)+1)+(t?' t':'')+(BIG.includes(n)?'':' nb');p.dataset.n=n;p.setAttribute('aria-label','Türchen '+n);
  p.style.cssText=`left:calc(var(--s)*${x+(h-.5)*.08});bottom:calc(var(--s)*${y*1.03});--d:${.1+i*.07}s;--rt:${((g-.5)*5).toFixed(1)}deg;--sc:${t?1:(.94+h*.1).toFixed(2)}`;
  p.innerHTML='<div class="in"><div class="bx"></div><div class="ld"></div><i class="r"></i><svg class="bow" viewBox="0 0 100 60"><use href="#bw"/></svg><b class="fl"></b><b class="fr"></b><span class="n">'+n+'</span></div>';
  cal.append(p)});apply()}
function apply(){const d=day();document.querySelectorAll('.pk').forEach(p=>{const n=+p.dataset.n,dn=done.has(n)&&n<=d;p.classList.toggle('past',n<d||dn);p.classList.toggle('done',dn);p.classList.toggle('today',n===d&&!dn)})}
$('cal').onclick=e=>{const p=e.target.closest('.pk');if(!p)return;const n=+p.dataset.n,d=day();
 if(n===d){ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();openDoor(n,p)}
 else if(n>d){p.classList.remove('wob');void p.offsetWidth;p.classList.add('wob')}};
// Tür öffnen: Klappen und Ton starten sofort beim Antippen
function openDoor(n,p){cur=n;const st=$('st');st.className='stage '+[...p.classList].find(c=>/^c\d$/.test(c));$('ct').textContent=D[n][0];$('cx').innerHTML=D[n][1];$('bn').textContent=n;$('ov').classList.add('on');
 bells();setTimeout(()=>st.classList.add('open'),30)}
$('cl').onclick=()=>{if(cur){done.add(cur);save()}$('ov').classList.remove('on');apply()};
// Glocken-Töne (selbst erzeugt, keine Dateien nötig)
function ping(f,t,g,d,ty){const o=ac.createOscillator(),v=ac.createGain();o.type=ty||'triangle';o.frequency.value=f;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function bell(f,t,g,d,P){(P||[[1,1],[2.76,.35],[5.4,.12]]).forEach(([r,m])=>ping(f*r,t,g*m,d/(.6+r*.4),'sine'))}
function shake(t0,n){for(let k=0;k<n;k++){const r=Math.random(),t=t0+r*.25,f=2800+Math.random()*3000,g=.04*(1.1-Math.abs(r-.5)*1.4);[[f,1],[f*1.51,.6],[f*2.3,.3]].forEach(([fr,m])=>ping(fr,t,g*m,.16+Math.random()*.1))}}
const TON=['Schlittenglocken-Rasseln','Jingle-Bells-Melodie','Kirchenglocken','Zauber-Glöckchen'];
const SND=[
()=>{const t=ac.currentTime+.02;[0,.38,.76].forEach(o=>{shake(t+o,22);ping(1568,t+o,.06,.7);ping(2093,t+o+.02,.04,.6)})},
